<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog and Cat Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        img { max-width: 300px; margin: 20px auto; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Dog and Cat Viewer</h1>
    <button id="dog-button">Show Dog</button>
    <button id="cat-button">Show Cat</button>
    <div id="image-container"></div>

    <script>
        document.getElementById('dog-button').addEventListener('click', fetchDog);
        document.getElementById('cat-button').addEventListener('click', fetchCat);

        function fetchDog() {
            fetch('https://dog.ceo/api/breeds/image/random')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('image-container').innerHTML = '<img src="' + data.message + '" alt="A cute dog" />';
                })
                .catch(error => console.error('Error fetching dog image:', error));
        }

        function fetchCat() {
            fetch('https://api.thecatapi.com/v1/images/search')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('image-container').innerHTML = '<img src="' + data[0].url + '" alt="A cute cat" />';
                })
                .catch(error => console.error('Error fetching cat image:', error));
        }
    </script>
</body>
</html>
