<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Animals Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-top: 0;
        }
        
        .image-placeholder {
            width: 100%;
            height: 300px;
            background-color: #f0f0f0;
            border: 3px dashed #ccc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .image-placeholder img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        
        .dog-btn {
            background-color: #ff9800;
        }
        
        .dog-btn:hover {
            background-color: #f57c00;
            transform: scale(1.05);
        }
        
        .cat-btn {
            background-color: #2196f3;
        }
        
        .cat-btn:hover {
            background-color: #1976d2;
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 Cute Animals 🐾</h1>
        
        <div class="image-placeholder" id="imagePlaceholder">
            <p class="loading">Click a button to see a cute animal!</p>
        </div>
        
        <div class="button-container">
            <button class="dog-btn" onclick="loadDog()">🐕 Dog</button>
            <button class="cat-btn" onclick="loadCat()">🐱 Cat</button>
        </div>
    </div>

    <script>
        function loadDog() {
            const placeholder = document.getElementById('imagePlaceholder');
            placeholder.innerHTML = '<p class="loading">Loading cute dog...</p>';
            
            fetch('https://dog.ceo/api/breeds/image/random')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        placeholder.innerHTML = `<img src="${data.message}" alt="Cute Dog">`;
                    } else {
                        placeholder.innerHTML = '<p>Failed to load dog image. Try again!</p>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    placeholder.innerHTML = '<p>Error loading image. Try again!</p>';
                });
        }
        
        function loadCat() {
            const placeholder = document.getElementById('imagePlaceholder');
            placeholder.innerHTML = '<p class="loading">Loading cute cat...</p>';
            
            fetch('https://api.thecatapi.com/v1/images/search?limit=1')
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        placeholder.innerHTML = `<img src="${data[0].url}" alt="Cute Cat">`;
                    } else {
                        placeholder.innerHTML = '<p>Failed to load cat image. Try again!</p>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    placeholder.innerHTML = '<p>Error loading image. Try again!</p>';
                });
        }
    </script>
</body>
</html>
